<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redactor</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">

<nav class="bp-navbar">
  <div class="bp-navbar-inner">
    <span class="bp-navbar-heading">Redactor</span>
    <span class="bp-navbar-divider"></span>
    <span class="bp-tag bp-tag-minimal" id="count"></span>
  </div>
</nav>

<div class="bp-popup-body">

  <div class="bp-section" id="accessSection">
    <h6 class="bp-section-title">Site access</h6>

    <div id="accessGranted" hidden>
      <p class="bp-text-small" style="margin:0 0 8px">
        Running on <span class="bp-host" id="hostGranted"></span>
      </p>
      <button id="revoke" class="bp-button">Remove access to this site</button>
    </div>

    <div id="accessMissing" hidden>
      <p class="bp-text-small bp-text-muted" style="margin:0 0 8px">
        Redactor has no access to <span class="bp-host" id="hostMissing"></span> and is doing
        nothing here.
      </p>
      <button id="grant" class="bp-button bp-intent-primary">Enable on this site</button>
    </div>

    <div id="accessUnavailable" hidden>
      <p class="bp-text-small bp-text-muted" style="margin:0">
        This page cannot be redacted — only <code>http</code> and <code>https</code> pages can.
      </p>
    </div>
  </div>

  <div class="bp-divider"></div>

  <div class="bp-section" id="controls">
    <label class="bp-control bp-switch">
      <input type="checkbox" id="enabled">
      <span class="bp-control-indicator"></span>
      Redaction on
    </label>
    <label class="bp-control bp-switch">
      <input type="checkbox" id="site">
      <span class="bp-control-indicator"></span>
      Run on <span class="bp-host" id="host">this site</span>
    </label>
  </div>

  <div class="bp-divider"></div>

  <div class="bp-section">
    <h6 class="bp-section-title">Mode</h6>
    <label class="bp-control bp-radio">
      <input type="radio" name="mode" value="overlay">
      <span class="bp-control-indicator"></span>
      Overlay <span class="bp-text-muted">— paint over</span>
    </label>
    <label class="bp-control bp-radio">
      <input type="radio" name="mode" value="replace">
      <span class="bp-control-indicator"></span>
      Replace <span class="bp-text-muted">— remove text</span>
    </label>
    <label class="bp-control bp-radio">
      <input type="radio" name="mode" value="substitute">
      <span class="bp-control-indicator"></span>
      Substitute <span class="bp-text-muted">— swap in stand-ins</span>
    </label>
  </div>

</div>

<div class="bp-footer">
  <button id="options" class="bp-button">Phrases &amp; options</button>
</div>

<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
